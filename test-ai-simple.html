
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ST语言助手 - 测试版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: white; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 2.5rem; background: linear-gradient(90deg, #3b82f6, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .chat-box { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; min-height: 400px; margin-bottom: 20px; overflow-y: auto; }
    .message { margin-bottom: 15px; padding: 12px 16px; border-radius: 12px; max-width: 80%; }
    .user-message { background: #3b82f6; margin-left: auto; }
    .assistant-message { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }
    .input-area { display: flex; gap: 10px; }
    .input-area input { flex: 1; padding: 12px 16px; border: none; border-radius: 12px; background: rgba(255,255,255,0.1); color: white; font-size: 16px; }
    .input-area input:focus { outline: none; box-shadow: 0 0 0 2px #3b82f6; }
    .input-area button { padding: 12px 24px; background: linear-gradient(90deg, #3b82f6, #2563eb); border: none; border-radius: 12px; color: white; font-size: 16px; cursor: pointer; transition: all 0.2s; }
    .input-area button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .loading { color: #f97316; }
    .error { color: #ef4444; }
    .success { color: #22c55e; }
    pre { background: #1e293b; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; }
    code { font-family: 'Fira Code', 'Consolas', monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ST语言编程助手</h1>
      <p style="color: #9ca3af; margin-top: 10px;">测试版本</p>
    </div>
    
    <div class="chat-box" id="chatBox">
      <div class="message assistant-message">
        你好！我是ST语言编程助手。请问有什么可以帮助你的？
      </div>
    </div>
    
    <div class="input-area">
      <input type="text" id="input" placeholder="输入你的问题..." onkeyup="if(event.keyCode===13) sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
    
    <div id="status" class="success" style="margin-top: 10px; text-align: center;">✓ 本地AI服务器已连接</div>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:8000/chat/completions';
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    function addMessage(content, isUser) {
      const message = document.createElement('div');
      message.className = isUser ? 'message user-message' : 'message assistant-message';
      
      const codeBlockRegex = /```(\w+)?\s*([\s\S]*?)```/g;
      let result = '';
      let lastIndex = 0;
      let match;
      
      while ((match = codeBlockRegex.exec(content)) !== null) {
        result += escapeHtml(content.slice(lastIndex, match.index));
        result += '<pre><code>' + escapeHtml(match[2] || match[0]) + '</code></pre>';
        lastIndex = match.index + match[0].length;
      }
      result += escapeHtml(content.slice(lastIndex));
      
      message.innerHTML = result;
      chatBox.appendChild(message);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function sendMessage() {
      const content = input.value.trim();
      if (!content) return;

      input.value = '';
      sendBtn.disabled = true;
      status.textContent = '正在思考...';
      status.className = 'loading';

      addMessage(content, true);

      try {
        console.log('正在发送请求到:', API_URL);
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Access-Control-Allow-Origin': '*'
          },
          body: JSON.stringify({
            model: 'local-model',
            messages: [{ role: 'user', content: content }],
          }),
          mode: 'cors'
        });

        console.log('响应状态:', response.status);
        
        if (!response.ok) {
          throw new Error('HTTP错误: ' + response.status);
        }

        const data = await response.json();
        addMessage(data.choices[0].message.content, false);
        status.textContent = '✓ 连接成功';
        status.className = 'success';
      } catch (error) {
        console.error('错误详情:', error);
        addMessage('抱歉，发生了错误: ' + error.message, false);
        status.textContent = '✗ 错误: ' + error.message;
        status.className = 'error';
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
